server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed Vite assets — long cache.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: /episodes, /requests/123/assignments, etc. must serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # If your frontend calls a RELATIVE /api/v1 path (no baked VITE_API_BASE_URL),
    # uncomment this and make sure the backend service is reachable as `backend`
    # on the Docker network (e.g. via docker-compose service name).
    #
    # location /api/ {
    #     proxy_pass         http://backend:8000;
    #     proxy_http_version 1.1;
    #     proxy_set_header   Host              $host;
    #     proxy_set_header   X-Real-IP         $remote_addr;
    #     proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header   X-Forwarded-Proto $scheme;
    # }
}