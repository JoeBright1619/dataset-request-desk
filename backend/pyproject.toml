[tool.poetry]
name = "dataset-request-desk"
version = "0.1.0"
description = "Internal tool for managing client dataset requests"
authors = []
readme = "../README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
pydantic = "^2.0"
pydantic-settings = "^2.0"
sqlalchemy = "^2.0"
alembic = "^1.13"
uvicorn = { extras = ["standard"], version = "^0.30" }
bcrypt = "^4.0"
pyjwt = "^2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
httpx = "^0.27"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"