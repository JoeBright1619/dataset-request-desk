[tool.poetry]
name = "dataset-request-desk"
version = "0.1.0"
description = "Internal tool for managing client dataset requests"
authors = []
readme = "../README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
pydantic = "^2.0"
pydantic-settings = "^2.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.1.1"}
alembic = "^1.13"
uvicorn = { extras = ["standard"], version = "^0.30" }
bcrypt = "^4.0"
pyjwt = "^2.0"
asyncpg = "^0.31.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
httpx = "^0.27"
ruff = "^0.16.9"
mypy = "^2.3.1"
bandit = "^1.9.4"
pre-commit = "^4.6.2"

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["app"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "."
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = [
    "fastapi.*",
    "pydantic.*",
    "sqlalchemy.*",
    "alembic.*",
    "uvicorn.*",
    "jwt.*",
]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"